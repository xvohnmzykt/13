apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-pvc
  namespace: teachingplatform
spec:
  storageClassName: local-storage
  volumeName: local-pv-db
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi


